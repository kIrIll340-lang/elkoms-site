  <desc id="desc">Предупреждающая табличка с молнией и надписью Осторожно! Качественный электромонтаж.</desc>
  <rect width="1200" height="400" fill="#000"/>
  <rect x="12" y="12" width="1176" height="376" fill="none" stroke="#f20d00" stroke-width="24"/>

  <g transform="translate(98 55)">
