    <polygon points="101 0 193 0 118 120 205 120 50 312 106 176 18 176" fill="#ffd500"/>
    <polygon points="118 120 205 120 50 312 106 176" fill="#ff9e00"/>
  </g>

  <g fill="#f4f4f4" font-family="Arial, Helvetica, sans-serif" font-weight="900">
